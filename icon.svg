<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- PDF Document Shape -->
  <g filter="url(#shadow)">
    <path d="M140 100 L300 100 L372 172 L372 412 L140 412 Z" fill="url(#docGrad)" rx="16" />
    <!-- Folded Corner -->
    <path d="M300 100 L372 172 L300 172 Z" fill="#818cf8" />
  </g>
  
  <!-- Lightning Bolt -->
  <path d="M280 140 L190 280 L250 280 L220 380 L320 240 L260 240 Z" fill="url(#boltGrad)" filter="url(#shadow)" />
  
  <!-- PDF Badge -->
  <rect x="180" y="340" width="152" height="42" rx="8" fill="#0f172a" opacity="0.9" />
  <text x="256" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#f8fafc" text-anchor="middle" letter-spacing="3">PDF</text>
</svg>
