<!DOCTYPE html>
<html lang="en" data-theme="light" class="tool-page-split light-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split PDF — PDF Tools</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tool.css">
</head>
<body class="tool-page-split">
  <!-- Unified Header Placeholder -->
  <header class="header" id="appHeader"></header>

  <main class="main-content">
    <div class="container">
      <section class="tool-hero">
        <div class="tool-hero-icon" style="background: #EA580C; box-shadow: 0 8px 24px rgba(234, 88, 12, 0.4);">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></svg>
        </div>
        <h1 data-i18n="tool.split">Split PDF</h1>
        <p data-i18n="tool.split.desc">Extract pages or split PDF into multiple files.</p>
      </section>

      <div class="tool-workspace">
        <!-- Dropzone -->
        <div class="dropzone" id="dropzone">
          <div class="dropzone-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
          </div>
          <div class="dropzone-title" data-i18n="dropzone.title">Drop your PDF file here</div>
          <div class="dropzone-subtitle" data-i18n="dropzone.subtitle.pdf">Supports PDF files</div>
        </div>

        <!-- Split Options -->
        <div id="optionsPanel" class="options-panel" style="display: none;">
          <div class="options-title">Split Mode</div>
          <div class="option-group">
            <button class="option-btn active" data-mode="extract" data-i18n="split.mode.extract">Extract Pages</button>
            <button class="option-btn" data-mode="range" data-i18n="split.mode.range">Split by Range</button>
            <button class="option-btn" data-mode="every" data-i18n="split.mode.every">Split Every N Pages</button>
          </div>

          <!-- Range Input Container -->
          <div id="rangeInputContainer" class="range-input-group" style="display: none; margin-top: 16px;">
            <label data-i18n="split.placeholder">Enter page numbers or ranges (e.g., 1-3, 5, 7-10):</label>
            <input type="text" id="rangeInput" placeholder="1-3, 5, 7-10">
          </div>

          <!-- Every N Input Container -->
          <div id="everyNContainer" class="range-input-group" style="display: none; margin-top: 16px;">
            <label><span data-i18n="split.every_label">Split every</span> <input type="number" id="everyNInput" value="1" min="1" style="width: 80px; padding: 6px; border-radius: 6px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); text-align: center;"> <span data-i18n="split.pages">pages</span></label>
          </div>
        </div>

        <!-- Page Grid for Visual Extraction -->
        <div id="pageGridContainer" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span style="font-size: 0.9rem; color: var(--text-secondary);" data-i18n="split.select_pages">Select pages to extract:</span>
            <div style="display: flex; gap: 8px;">
              <button id="selectAllBtn" class="btn btn-sm btn-secondary" style="display: flex; align-items: center; gap: 5px;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Select All</span>
              </button>
              <button id="deselectAllBtn" class="btn btn-sm btn-secondary" style="display: flex; align-items: center; gap: 5px;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                <span>Deselect All</span>
              </button>
            </div>
          </div>
          <div id="pageGrid" class="page-grid"></div>
        </div>

        <!-- Progress Bar -->
        <div id="progressBar" class="progress-container">
          <div class="progress-bar-track">
            <div class="progress-bar-fill"></div>
          </div>
          <div class="progress-text" data-i18n="action.processing">Processing...</div>
        </div>

        <!-- Result Area -->
        <div id="resultArea" class="result-area">
          <div class="result-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="result-title" data-i18n="result.split_success">PDF split successfully!</div>
          <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap;">
            <button id="downloadBtn" class="btn btn-primary btn-lg" data-i18n="action.download">Download Result</button>
            <button id="openStudioBtn" class="btn btn-secondary btn-lg" style="display: inline-flex; align-items: center; gap: 8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              <span data-i18n="action.open_studio">Open in PDF Studio</span>
            </button>
            <button id="resetBtn" class="btn btn-secondary btn-lg" data-i18n="action.clear">Start Over</button>
          </div>
        </div>

        <!-- Action Bar -->
        <div id="actionBar" class="action-bar">
          <button id="splitBtn" class="btn btn-primary btn-lg" data-i18n="action.split">Split PDF</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footer.text">PDF Tools — All processing is done locally in your browser.</p>
    </div>
  </footer>

  <!-- Libraries -->
  <script src="../js/lib/pdf-lib.min.js"></script>
  <script src="../js/lib/pdf.min.js"></script>
  <script src="../js/lib/pdf.worker.min.js"></script>
  <script src="../js/lib/jszip.min.js"></script>
  <script src="../js/lib/FileSaver.min.js"></script>

  <!-- App Core & Utils -->
  <script src="../js/utils/i18n.js"></script>
  <script src="../js/utils/file-utils.js"></script>
  <script src="../js/utils/download.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/progress.js"></script>
  <script src="../js/components/pdf-preview.js"></script>
  <script src="../js/components/dropzone.js"></script>
  <script src="../js/core/pdf-copy.js"></script>
  <script src="../js/core/pdf-split.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const dropzoneEl = document.getElementById('dropzone');
      const optionsPanel = document.getElementById('optionsPanel');
      const pageGridContainer = document.getElementById('pageGridContainer');
      const pageGrid = document.getElementById('pageGrid');
      const rangeInputContainer = document.getElementById('rangeInputContainer');
      const rangeInput = document.getElementById('rangeInput');
      const everyNContainer = document.getElementById('everyNContainer');
      const everyNInput = document.getElementById('everyNInput');
      const selectAllBtn = document.getElementById('selectAllBtn');
      const deselectAllBtn = document.getElementById('deselectAllBtn');
      const actionBar = document.getElementById('actionBar');
      const splitBtn = document.getElementById('splitBtn');
      const resultArea = document.getElementById('resultArea');
      const downloadBtn = document.getElementById('downloadBtn');
      const resetBtn = document.getElementById('resetBtn');

      let currentFile = null;
      let totalPages = 0;
      let selectedMode = 'extract';
      let splitOutput = null; // Uint8Array or Array of {name, data}
      const progress = PDFTools.Progress('progressBar');

      PDFTools.Dropzone('dropzone', {
        accept: '.pdf',
        multiple: false,
        onFiles: async function (files) {
          currentFile = files[0];
          dropzoneEl.style.display = 'none';
          optionsPanel.style.display = 'block';
          pageGridContainer.style.display = 'block';
          actionBar.classList.add('active');

          try {
            const res = await PDFTools.Preview.renderAllPages(currentFile, pageGrid, {
              initiallySelected: true
            });
            totalPages = res.totalPages;
            everyNInput.max = totalPages;
          } catch (e) {
            PDFTools.Toast.error('Could not render PDF pages.');
          }
        }
      });

      // Mode toggle
      document.querySelectorAll('.option-group .option-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.option-group .option-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedMode = btn.getAttribute('data-mode');

          if (selectedMode === 'extract') {
            pageGridContainer.style.display = 'block';
            rangeInputContainer.style.display = 'none';
            everyNContainer.style.display = 'none';
          } else if (selectedMode === 'range') {
            pageGridContainer.style.display = 'none';
            rangeInputContainer.style.display = 'block';
            everyNContainer.style.display = 'none';
          } else if (selectedMode === 'every') {
            pageGridContainer.style.display = 'none';
            rangeInputContainer.style.display = 'none';
            everyNContainer.style.display = 'block';
          }
        });
      });

      selectAllBtn.addEventListener('click', () => {
        document.querySelectorAll('.page-card').forEach(c => c.classList.add('selected'));
      });

      deselectAllBtn.addEventListener('click', () => {
        document.querySelectorAll('.page-card').forEach(c => c.classList.remove('selected'));
      });

      splitBtn.addEventListener('click', async function () {
        if (!currentFile) return;

        splitBtn.disabled = true;
        progress.show(PDFTools.i18n.t('action.processing'));

        try {
          if (selectedMode === 'extract') {
            const selectedCards = document.querySelectorAll('.page-card.selected');
            if (selectedCards.length === 0) {
              throw new Error(PDFTools.i18n.t('toast.select_pages'));
            }
            const indices = Array.from(selectedCards).map(c => parseInt(c.getAttribute('data-page'), 10) - 1);
            splitOutput = {
              type: 'single',
              data: await PDFTools.Split.extractPages(currentFile, indices),
              filename: `${currentFile.name.replace(/\.pdf$/i, '')}_extracted.pdf`
            };
          } else if (selectedMode === 'range') {
            const val = rangeInput.value.trim();
            if (!val) throw new Error('Please enter a valid page range.');
            const indices = PDFTools.Split.parseRange(val, totalPages);
            if (indices.length === 0) throw new Error('No valid pages found in specified range.');
            splitOutput = {
              type: 'single',
              data: await PDFTools.Split.extractPages(currentFile, indices),
              filename: `${currentFile.name.replace(/\.pdf$/i, '')}_range.pdf`
            };
          } else if (selectedMode === 'every') {
            const n = parseInt(everyNInput.value, 10) || 1;
            const parts = await PDFTools.Split.splitEveryN(currentFile, n, function (percent, text) {
              progress.update(percent, text);
            });
            splitOutput = {
              type: 'zip',
              files: parts,
              filename: `${currentFile.name.replace(/\.pdf$/i, '')}_split_parts.zip`
            };
          }

          progress.hide();
          optionsPanel.style.display = 'none';
          pageGridContainer.style.display = 'none';
          actionBar.classList.remove('active');
          resultArea.classList.add('active');

          if (PDFTools.RecentFiles && currentFile) {
            PDFTools.RecentFiles.add(currentFile.name, currentFile.size, 'Split PDF', 'split');
          }

          PDFTools.Toast.success(PDFTools.i18n.t('result.split_success'));
        } catch (err) {
          console.error(err);
          progress.hide();
          PDFTools.Toast.error(err.message || PDFTools.i18n.t('toast.error'));
          splitBtn.disabled = false;
        }
      });

      // Check for pending handoff file from homepage (B1)
      if (PDFTools.FileUtils && PDFTools.FileUtils.consumePendingFile) {
        PDFTools.FileUtils.consumePendingFile().then(file => {
          if (file) {
            currentFile = file;
            dropzoneEl.style.display = 'none';
            optionsPanel.style.display = 'block';
            pageGridContainer.style.display = 'block';
            actionBar.classList.add('active');
            PDFTools.Preview.renderAllPages(currentFile, pageGrid, { initiallySelected: true }).then(res => {
              totalPages = res.totalPages;
              everyNInput.max = totalPages;
            }).catch(() => PDFTools.Toast.error('Could not render PDF pages.'));
          }
        });
      }

      downloadBtn.addEventListener('click', function () {
        if (!splitOutput) return;
        if (splitOutput.type === 'single') {
          PDFTools.Download.save(splitOutput.data, splitOutput.filename);
        } else if (splitOutput.type === 'zip') {
          PDFTools.Download.saveAsZip(splitOutput.files, splitOutput.filename);
        }
      });

      const openStudioBtn = document.getElementById('openStudioBtn');
      if (openStudioBtn) {
        openStudioBtn.addEventListener('click', () => {
          if (!splitOutput) return;
          let fileToOpen = null;
          if (splitOutput.type === 'single' && splitOutput.data) {
            const blob = new Blob([splitOutput.data], { type: 'application/pdf' });
            fileToOpen = new File([blob], splitOutput.filename || 'split_document.pdf', { type: 'application/pdf' });
          } else if (splitOutput.type === 'zip' && splitOutput.files && splitOutput.files.length > 0) {
            const first = splitOutput.files[0];
            const blob = new Blob([first.data], { type: 'application/pdf' });
            fileToOpen = new File([blob], first.name || 'split_part_1.pdf', { type: 'application/pdf' });
          }
          if (fileToOpen && PDFTools.FileUtils && PDFTools.FileUtils.setPendingFile) {
            PDFTools.FileUtils.setPendingFile(fileToOpen);
            window.location.href = 'viewer.html';
          }
        });
      }

      resetBtn.addEventListener('click', function () {
        currentFile = null;
        splitOutput = null;
        splitBtn.disabled = false;
        resultArea.classList.remove('active');
        dropzoneEl.style.display = 'block';
        optionsPanel.style.display = 'none';
        pageGridContainer.style.display = 'none';
        pageGrid.innerHTML = '';
      });
    });
  </script>
</body>
</html>
