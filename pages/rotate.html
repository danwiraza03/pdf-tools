<!DOCTYPE html>
<html lang="en" data-theme="light" class="tool-page-rotate light-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate PDF — Rotate PDF Pages Permanently Online & Offline</title>
  <meta name="description" content="Rotate PDF pages 90, 180, or 270 degrees clockwise or counterclockwise. Rotate specific pages or the entire document 100% offline.">
  <link rel="canonical" href="https://danwiraza03.github.io/pdf-tools/pages/rotate.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PDF Tools">
  <meta property="og:title" content="Rotate PDF — Rotate PDF Pages Permanently Online & Offline">
  <meta property="og:description" content="Rotate PDF pages 90, 180, or 270 degrees clockwise or counterclockwise. Rotate specific pages or the entire document 100% offline.">
  <meta property="og:url" content="https://danwiraza03.github.io/pdf-tools/pages/rotate.html">
  <meta property="og:image" content="https://danwiraza03.github.io/pdf-tools/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rotate PDF — Rotate PDF Pages Permanently Online & Offline">
  <meta name="twitter:description" content="Rotate PDF pages 90, 180, or 270 degrees clockwise or counterclockwise. Rotate specific pages or the entire document 100% offline.">
  <meta name="twitter:image" content="https://danwiraza03.github.io/pdf-tools/assets/og-image.png">
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tool.css">
  <style>
    .page-card {
      transition: transform 0.3s ease;
    }
    .page-card.rotated-90 .page-card-preview { transform: rotate(90deg); }
    .page-card.rotated-180 .page-card-preview { transform: rotate(180deg); }
    .page-card.rotated-270 .page-card-preview { transform: rotate(270deg); }
    .rotate-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      font-size: 0.75rem;
      background: var(--tool-color);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }
    .has-rotation .rotate-badge {
      display: block;
    }
  </style>
</head>
<body class="tool-page-rotate">
  <a href="#main-content" class="skip-link" data-i18n="a11y.skip">Skip to content</a>
  <header class="header" id="appHeader"></header>

  <main id="main-content" class="main-content" tabindex="-1">
    <div class="container">
      <section class="tool-hero">
        <div class="tool-hero-icon" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin: 0 auto 16px; background: rgba(59, 130, 246, 0.12); color: #3B82F6; border-radius: 16px;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
        </div>
        <h1 data-i18n="tool.rotate">Rotate PDF</h1>
        <p data-i18n="tool.rotate.desc">Rotate PDF pages to the correct orientation.</p>
      </section>

      <div class="tool-workspace">
        <div class="dropzone" id="dropzone">
          <div class="dropzone-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
          </div>
          <div class="dropzone-title" data-i18n="dropzone.title">Drop your PDF file here</div>
          <div class="dropzone-subtitle" data-i18n="dropzone.subtitle.pdf">Supports PDF files</div>
        </div>

        <div id="controlsPanel" style="display: none; margin-bottom: 20px;">
          <div class="rotate-controls">
            <button id="rotateLeftAllBtn" class="rotate-btn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
              <span data-i18n="rotate.left">Rotate Left All</span>
            </button>
            <button id="rotateRightAllBtn" class="rotate-btn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
              <span data-i18n="rotate.right">Rotate Right All</span>
            </button>
            <button id="rotate180AllBtn" class="rotate-btn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><polyline points="8 16 3 16 3 21"/><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><polyline points="16 8 21 8 21 3"/></svg>
              <span data-i18n="rotate.180">Rotate 180° All</span>
            </button>
          </div>
          <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
            Tip: Click on individual pages to rotate them 90° clockwise.
          </p>
        </div>

        <div id="pageGrid" class="page-grid" style="display: none;"></div>

        <div id="progressBar" class="progress-container">
          <div class="progress-bar-track">
            <div class="progress-bar-fill"></div>
          </div>
          <div class="progress-text" data-i18n="action.processing">Processing...</div>
        </div>

        <div id="resultArea" class="result-area">
          <div class="result-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="result-title" data-i18n="result.rotate_success">Pages rotated successfully!</div>
          <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap;">
            <button id="downloadBtn" class="btn btn-primary btn-lg" data-i18n="action.download">Download PDF</button>
            <button id="openStudioBtn" class="btn btn-secondary btn-lg" style="display: inline-flex; align-items: center; gap: 8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              <span data-i18n="action.open_studio">Open in PDF Studio</span>
            </button>
            <button id="resetBtn" class="btn btn-secondary btn-lg" data-i18n="action.clear">Start Over</button>
          </div>
        </div>

        <div id="actionBar" class="action-bar">
          <button id="applyRotateBtn" class="btn btn-primary btn-lg" data-i18n="action.rotate">Apply Rotation</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footer.text">PDF Tools — All processing is done locally in your browser.</p>
    </div>
  </footer>

  <script src="../js/lib/pdf-lib.min.js"></script>
  <script src="../js/lib/pdf.min.js"></script>
  <script src="../js/lib/pdf.worker.min.js"></script>
  <script src="../js/lib/FileSaver.min.js"></script>
  <script src="../js/utils/i18n.js"></script>
  <script src="../js/utils/file-utils.js"></script>
  <script src="../js/utils/download.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/progress.js"></script>
  <script src="../js/components/pdf-preview.js"></script>
  <script src="../js/components/dropzone.js"></script>
  <script src="../js/core/pdf-rotate.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/rotate.js"></script>
</body>
</html>
